<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patient appreciation comparison</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #13272b;
        color: #fff;
        font-family: Arial, sans-serif;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        margin-bottom: 10px;
        font-weight: 700;
      }
      img {
        display: block;
        width: 100%;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Reference - five cards added to former four-card grid</figcaption>
        <img src="patient-appreciation-reference.png" alt="Reference" />
      </figure>
      <figure>
        <figcaption>Final - balanced 3 + 2 card layout</figcaption>
        <img src="patient-appreciation-desktop.png" alt="Final implementation" />
      </figure>
    </main>
  </body>
</html>
