<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Journey caption comparison</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #13272b;
        color: #fff;
        font-family: Arial, sans-serif;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        margin-bottom: 10px;
        font-weight: 700;
      }
      img {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>
          Before - photography notes hidden, no patient-facing overlay
        </figcaption>
        <img src="journey-caption-reference.png" alt="Before" />
      </figure>
      <figure>
        <figcaption>
          After - concise patient-facing captions on each image
        </figcaption>
        <img src="journey-caption-desktop.png" alt="After" />
      </figure>
    </main>
  </body>
</html>
