<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Journey image captions QA</title>
    <style>
      html,
      body,
      iframe {
        width: 100%;
        height: 100%;
        margin: 0;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe id="page" src="../index.html" title="Website preview"></iframe>
    <script>
      document.getElementById("page").addEventListener("load", (event) => {
        const section =
          event.currentTarget.contentDocument.querySelector(".portfolio-list");
        if (section) {
          event.currentTarget.contentWindow.scrollTo({
            top:
              section.getBoundingClientRect().top +
              event.currentTarget.contentWindow.scrollY -
              210,
            behavior: "instant",
          });
        }
      });
    </script>
  </body>
</html>
