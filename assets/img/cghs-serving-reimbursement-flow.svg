<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Serving CGHS beneficiary reimbursement flow</title>
  <desc id="desc">Show your CGHS card, get tested, pay as per CGHS rates, collect receipt, and get full reimbursement from your office as per CGHS rules or departmental policy. Certain categories of serving CGHS beneficiaries are also entitled to cashless service, including those working with CGHS, MoHFW, UPSA, Lok Sabha, Rajya Sabha, ICAR and IASRI.</desc>
  <rect width="1200" height="900" rx="18" fill="#f7fbfa"/>
  <rect x="42" y="40" width="1116" height="820" rx="22" fill="#ffffff" stroke="#d9ebe7" stroke-width="2"/>

  <text x="600" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#14805f">SERVING OR WORKING CGHS BENEFICIARY</text>
  <text x="600" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800" fill="#075c68">Pay CGHS rates, claim reimbursement</text>
  <text x="600" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#47636a">Follow these steps for departmental reimbursement.</text>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#07464e" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10 Z" fill="#55bf93"/>
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(74 238)" filter="url(#shadow)">
      <rect width="184" height="250" rx="20" fill="#ffffff" stroke="#dbeae7" stroke-width="2"/>
      <circle cx="92" cy="64" r="38" fill="#e9f8f3"/>
      <rect x="69" y="47" width="46" height="34" rx="5" fill="none" stroke="#075c68" stroke-width="4"/>
      <circle cx="82" cy="64" r="5" fill="#075c68"/>
      <path d="M94 57 H108 M94 68 H108" stroke="#075c68" stroke-width="4" stroke-linecap="round"/>
      <text x="92" y="132" text-anchor="middle" font-size="26" font-weight="800" fill="#075c68">
        <tspan x="92">Show your</tspan>
        <tspan x="92" dy="30">CGHS card</tspan>
      </text>
      <text x="92" y="201" text-anchor="middle" font-size="17" fill="#45626a">
        <tspan x="92">Carry valid card</tspan>
        <tspan x="92" dy="23">and prescription</tspan>
      </text>
    </g>

    <path d="M282 363 H322" stroke="#55bf93" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(334 238)" filter="url(#shadow)">
      <rect width="184" height="250" rx="20" fill="#ffffff" stroke="#dbeae7" stroke-width="2"/>
      <circle cx="92" cy="64" r="38" fill="#e9f8f3"/>
      <path d="M70 78 L84 50 L100 78 L114 50" fill="none" stroke="#075c68" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="92" y="132" text-anchor="middle" font-size="27" font-weight="800" fill="#075c68">
        <tspan x="92">Get tested</tspan>
      </text>
      <text x="92" y="201" text-anchor="middle" font-size="17" fill="#45626a">
        <tspan x="92">Home collection</tspan>
        <tspan x="92" dy="23">or centre visit</tspan>
      </text>
    </g>

    <path d="M542 363 H582" stroke="#55bf93" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(594 238)" filter="url(#shadow)">
      <rect width="184" height="250" rx="20" fill="#ffffff" stroke="#dbeae7" stroke-width="2"/>
      <circle cx="92" cy="64" r="38" fill="#e9f8f3"/>
      <text x="92" y="78" text-anchor="middle" font-size="46" font-weight="800" fill="#075c68">Rs</text>
      <text x="92" y="125" text-anchor="middle" font-size="25" font-weight="800" fill="#075c68">
        <tspan x="92">Pay as per</tspan>
        <tspan x="92" dy="30">CGHS rates</tspan>
      </text>
      <text x="92" y="207" text-anchor="middle" font-size="17" fill="#45626a">
        <tspan x="92">Applicable rates</tspan>
        <tspan x="92" dy="23">for listed tests</tspan>
      </text>
    </g>

    <path d="M802 363 H842" stroke="#55bf93" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(854 238)" filter="url(#shadow)">
      <rect width="184" height="250" rx="20" fill="#ffffff" stroke="#dbeae7" stroke-width="2"/>
      <circle cx="92" cy="64" r="38" fill="#e9f8f3"/>
      <path d="M76 44 H108 V86 L101 82 L94 86 L87 82 L80 86 L76 82 Z" fill="none" stroke="#075c68" stroke-width="4" stroke-linejoin="round"/>
      <path d="M86 58 H100 M86 70 H100" stroke="#075c68" stroke-width="4" stroke-linecap="round"/>
      <text x="92" y="132" text-anchor="middle" font-size="26" font-weight="800" fill="#075c68">
        <tspan x="92">Collect</tspan>
        <tspan x="92" dy="30">receipt</tspan>
      </text>
      <text x="92" y="201" text-anchor="middle" font-size="17" fill="#45626a">
        <tspan x="92">Use bill and</tspan>
        <tspan x="92" dy="23">receipt for claim</tspan>
      </text>
    </g>

    <path d="M600 514 C600 566 1000 566 1000 514" fill="none" stroke="#55bf93" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(262 568)">
      <rect width="676" height="92" rx="18" fill="#075c68"/>
      <circle cx="58" cy="46" r="27" fill="#e9f8f3"/>
      <path d="M48 46 L56 54 L70 38" fill="none" stroke="#14805f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="104" y="40" font-size="25" font-weight="800" fill="#ffffff">Get full reimbursement from your office</text>
      <text x="104" y="69" font-size="19" fill="#d7f2eb">As per CGHS rules or your departmental policy.</text>
    </g>

    <g transform="translate(132 700)">
      <rect width="936" height="108" rx="18" fill="#eefaf6" stroke="#bfe4d8" stroke-width="2"/>
      <circle cx="52" cy="54" r="25" fill="#ffffff" stroke="#55bf93" stroke-width="3"/>
      <text x="52" y="63" text-anchor="middle" font-size="28" font-weight="800" fill="#075c68">i</text>
      <text x="94" y="38" font-size="20" font-weight="800" fill="#075c68">Cashless may apply for certain serving CGHS categories</text>
      <text x="94" y="68" font-size="17" fill="#38545c">
        <tspan x="94">CGHS, MoHFW, UPSA, Lok Sabha, Rajya Sabha, ICAR and IASRI beneficiaries should submit</tspan>
        <tspan x="94" dy="24">their current ID card with CGHS card, plus a prescription from CGHS dispensary, govt hospital or specialist.</tspan>
      </text>
    </g>
  </g>
</svg>
